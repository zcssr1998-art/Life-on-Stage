name: V7 Nightly Monte Carlo
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Run 1200 full-life simulations
        env:
          V7_RUNS: '1200'
        run: npm run test:v7
      - uses: actions/upload-artifact@v4
        with:
          name: v7-simulation-report
          path: v7/generated/sim-report.json
