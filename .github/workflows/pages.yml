name: Deploy Life on Stage V7 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install V7 build and browser-test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps webkit
      - name: V7 typecheck, content migration and simulation regression
        run: npm run test:v7
      - name: Start local site for browser regression
        run: |
          python3 -m http.server 4173 >/tmp/life-stage-http.log 2>&1 &
          echo $! > /tmp/life-stage-http.pid
      - name: V8 desktop/mobile/save/start/rarity browser regression
        run: npx playwright test tests/v7-webkit.spec.js tests/v8.2-start-rarity.spec.js --project=webkit
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
