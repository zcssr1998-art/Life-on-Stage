name: V7 Browser Regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install build and WebKit test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps webkit
      - name: Build V7
        run: npm run build:v7
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/life-stage-http.log 2>&1 &
          echo $! > /tmp/life-stage-http.pid
      - name: Run V7 desktop/mobile refresh-resume regression
        run: npx playwright test tests/v7-webkit.spec.js --project=webkit
