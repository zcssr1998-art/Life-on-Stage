<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7 模拟仪表盘</title><link rel="stylesheet" href="./style.css?v=7.0"></head><body><main class="shell"><h1>V7 自动模拟仪表盘</h1><p>这个页面读取每次部署前自动跑出来的 <code>sim-report.json</code>。如果关键分布越界，Pages 不会部署。</p><div id="m" class="metrics"></div><pre id="raw" class="panel"></pre></main><script type="module">const r=await fetch('./generated/sim-report.json?v='+Date.now()).then(x=>x.json());const pct=x=>(x*100).toFixed(1)+'%';const items=[['模拟局数',r.runs],['中位寿命',r.medianAge+'岁'],['90+占比',pct(r.age90plus)],['负债结局',pct(r.debtRate)],['伴侣激活',pct(r.partnerRate)],['百万峰值',pct(r.millionPeakRate)],['闪点触发',pct(r.fateRate)],['关系网均值',r.avgContacts.toFixed(1)+'人'],['最终财富中位',Math.round(r.medianFinalWealth/10000)+'万'],['财富P10→P90',Math.round(r.p10Wealth/10000)+'万 → '+Math.round(r.p90Wealth/10000)+'万']];document.querySelector('#m').innerHTML=items.map(([a,b])=>`<div><small>${a}</small><strong>${b}</strong></div>`).join('');document.querySelector('#raw').textContent=JSON.stringify(r,null,2);</script></body></html>
